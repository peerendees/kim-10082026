server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Schriften lange cachen, sie aendern sich nicht
    location ~* \.(woff2|woff|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        types { font/woff2 woff2; font/woff woff; font/ttf ttf; }
    }

    # CSS und JS immer neu pruefen. Sonst bleibt ein alter Cache bei
    # Cloudflare stehen, waehrend die HTML schon den neuen Stand zeigt.
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # HTML nie cachen, damit Textaenderungen sofort ankommen
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Kompression
    gzip on;
    gzip_types text/css application/javascript text/html;
    gzip_min_length 512;
}
