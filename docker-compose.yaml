services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - root_default
    labels:
      - traefik.enable=true
      - traefik.docker.network=root_default
      - traefik.http.routers.kim-10082026.rule=Host(`kim-10082026.berent.ai`)
      - traefik.http.routers.kim-10082026.entrypoints=websecure
      - traefik.http.routers.kim-10082026.tls=true
      - traefik.http.routers.kim-10082026.service=kim-10082026
      - traefik.http.services.kim-10082026.loadbalancer.server.port=80

networks:
  root_default:
    external: true
